
<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
    <style>
        body {
            font-family: Arial;
            margin: 30px;
            text-align: center;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: lightblue;
        }

        .add {
            background-color: green;
            color: white;
        }

        .delete {
            background-color: red;
            color: white;
        }
    </style>
</head>
<body>

    <h2>Student Management System</h2>

    <form id="studentForm">
        <input type="text" id="id" placeholder="Student ID" required>
        <input type="text" id="name" placeholder="Student Name" required>
        <input type="text" id="course" placeholder="Course" required>
        <input type="number" id="marks" placeholder="Marks (0-100)"
               min="0" max="100" required>
        <button type="submit" class="add">Add Student</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="studentTable"></tbody>
    </table>

    <script>
        // Load students from Local Storage
        let students = JSON.parse(
            localStorage.getItem("students")
        ) || [];

        // Save students as JSON
        function saveStudents() {
            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );
        }

        // Display students dynamically in HTML table
        function displayStudents() {
            let table = document.getElementById("studentTable");
            table.innerHTML = "";

            students.forEach((student, index) => {
                let row = table.insertRow();

                row.insertCell(0).textContent = student.id;
                row.insertCell(1).textContent = student.name;
                row.insertCell(2).textContent = student.course;
                row.insertCell(3).textContent = student.marks;

                let cell = row.insertCell(4);
                let button = document.createElement("button");

                button.textContent = "Delete";
                button.className = "delete";

                button.onclick = function() {
                    students.splice(index, 1);
                    saveStudents();
                    displayStudents();
                };

                cell.appendChild(button);
            });
        }

        // Add student
        document.getElementById("studentForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();

            let student = {
                id: document.getElementById("id").value.trim(),
                name: document.getElementById("name").value.trim(),
                course: document.getElementById("course").value.trim(),
                marks: Number(document.getElementById("marks").value)
            };

            if (student.marks < 0 || student.marks > 100) {
                alert("Marks must be between 0 and 100");
                return;
            }

            if (students.some(s => s.id === student.id)) {
                alert("Student ID already exists!");
                return;
            }

            students.push(student);
            saveStudents();
            displayStudents();

            this.reset();
        });

        // Display saved students on page load
        displayStudents();
    </script>

</body>
</html>
